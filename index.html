<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newson Sportec Precision Spokes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .image-wrapper {
      position: relative;
      width: 100%;

      /* x2 bigger than the first version */
      max-width: 2048px;

      margin: 0 auto;
    }

    .main-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /*
      Invisible clickable area over:
      "SPOKE MEASUREMENT" button
    */
    .spoke-measurement-link {
      position: absolute;
      left: 13.5%;
      top: 81.2%;
      width: 74%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 22px;
      text-decoration: none;
    }

    /*
      Invisible clickable area over:
      "SPOKE SPECIFICATION" button
    */
    .spoke-specification-link {
      position: absolute;
      left: 13.5%;
      top: 90.2%;
      width: 74%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 22px;
      text-decoration: none;
    }

    .spoke-measurement-link:hover,
    .spoke-specification-link:hover {
      background: rgba(164, 255, 0, 0.12);
      box-shadow: 0 0 30px rgba(164, 255, 0, 0.85);
    }

    @media (max-width: 768px) {
      .image-wrapper {
        max-width: 100%;
      }

      .spoke-measurement-link {
        left: 13.5%;
        top: 81.2%;
        width: 74%;
        height: 7.5%;
      }

      .spoke-specification-link {
        left: 13.5%;
        top: 90.2%;
        width: 74%;
        height: 7.5%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="image-wrapper">

      <!-- Main poster image -->
      <img
        src="poster.png"
        alt="Newson Sportec Precision Spokes"
        class="main-image"
      />

      <!-- Clickable Spoke Measurement button -->
      <a
        class="spoke-measurement-link"
        href="https://newsonsportec.github.io/spoke-measurement-guide/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spoke Measurement Guide"
        title="Spoke Measurement"
      ></a>

      <!-- Clickable Spoke Specification button -->
      <a
        class="spoke-specification-link"
        href="https://newsonsportec.github.io/Spoke-Specifications/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spoke Specifications"
        title="Spoke Specification"
      ></a>

    </div>
  </main>
</body>
</html>

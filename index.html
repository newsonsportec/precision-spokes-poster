<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newson Sportec Precision Spokes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      max-width: 2048px;
      margin: 0 auto;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Fixed glow area around Newson Sportec logo */
    .logo-glow {
      position: absolute;
      left: 34%;
      top: 1.5%;
      width: 31%;
      height: 18%;
      pointer-events: none;
      border-radius: 50%;
      box-shadow:
        0 0 25px rgba(164, 255, 0, 0.45),
        0 0 55px rgba(164, 255, 0, 0.35),
        0 0 90px rgba(164, 255, 0, 0.25);
      z-index: 2;
    }

    /* Fixed shine area over the spoke */
    .spoke-glow {
      position: absolute;
      left: 4%;
      top: 33%;
      width: 90%;
      height: 7%;
      pointer-events: none;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.16),
        rgba(164, 255, 0, 0.12),
        rgba(255, 255, 255, 0.16),
        rgba(255, 255, 255, 0)
      );
      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.25),
        0 0 35px rgba(164, 255, 0, 0.25);
      z-index: 2;
    }

    /* Fixed sparkle stars */
    .sparkle {
      position: absolute;
      width: 18px;
      height: 18px;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 0 8px rgba(210, 255, 0, 0.95));
    }

    .sparkle::before,
    .sparkle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(235, 255, 140, 0.95);
      border-radius: 3px;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 8px rgba(235, 255, 140, 0.95),
        0 0 18px rgba(220, 255, 100, 0.75),
        0 0 30px rgba(255, 255, 255, 0.45);
    }

    .sparkle::before {
      width: 2px;
      height: 100%;
    }

    .sparkle::after {
      width: 100%;
      height: 2px;
    }

    .sparkle.small {
      width: 12px;
      height: 12px;
    }

    .sparkle.large {
      width: 26px;
      height: 26px;
    }

    /* Logo fixed sparkles */
    .logo-sparkle-1 {
      left: 43%;
      top: 4%;
    }

    .logo-sparkle-2 {
      left: 54%;
      top: 7%;
    }

    .logo-sparkle-3 {
      left: 60%;
      top: 13%;
    }

    /* Spoke fixed sparkles */
    .spoke-sparkle-1 {
      left: 15%;
      top: 38%;
    }

    .spoke-sparkle-2 {
      left: 33%;
      top: 36%;
    }

    .spoke-sparkle-3 {
      left: 52%;
      top: 34%;
    }

    .spoke-sparkle-4 {
      left: 73%;
      top: 32%;
    }

    .spoke-sparkle-5 {
      left: 88%;
      top: 30%;
    }

    /* Clickable Spoke Measurement button */
    .spoke-measurement-link {
      position: absolute;
      left: 13.5%;
      top: 81.2%;
      width: 74%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 22px;
      text-decoration: none;
      z-index: 5;
    }

    /* Clickable Spoke Specification button */
    .spoke-specification-link {
      position: absolute;
      left: 13.5%;
      top: 90.2%;
      width: 74%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 22px;
      text-decoration: none;
      z-index: 5;
    }

    .spoke-measurement-link:hover,
    .spoke-specification-link:hover {
      background: rgba(164, 255, 0, 0.12);
      box-shadow: 0 0 30px rgba(164, 255, 0, 0.85);
    }

    @media (max-width: 768px) {
      .image-wrapper {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="image-wrapper">

      <img
        src="poster.png"
        alt="Newson Sportec Precision Spokes"
        class="main-image"
      />

      <!-- Fixed logo glow -->
      <div class="logo-glow"></div>

      <!-- Fixed spoke glow -->
      <div class="spoke-glow"></div>

      <!-- Fixed logo sparkles -->
      <span class="sparkle large logo-sparkle-1"></span>
      <span class="sparkle small logo-sparkle-2"></span>
      <span class="sparkle logo-sparkle-3"></span>

      <!-- Fixed spoke sparkles -->
      <span class="sparkle small spoke-sparkle-1"></span>
      <span class="sparkle spoke-sparkle-2"></span>
      <span class="sparkle large spoke-sparkle-3"></span>
      <span class="sparkle small spoke-sparkle-4"></span>
      <span class="sparkle spoke-sparkle-5"></span>

      <!-- Clickable Spoke Measurement button -->
      <a
        class="spoke-measurement-link"
        href="https://newsonsportec.github.io/spoke-measurement-guide/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spoke Measurement Guide"
        title="Spoke Measurement"
      ></a>

      <!-- Clickable Spoke Specification button -->
      <a
        class="spoke-specification-link"
        href="https://newsonsportec.github.io/Spoke-Specifications/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spoke Specifications"
        title="Spoke Specification"
      ></a>

    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newson Sportec Precision Spokes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      max-width: 2048px; /* x2 bigger version */
      margin: 0 auto;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ---------- Sparkle zones ---------- */
    .sparkle-zone {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    /* Logo sparkle area */
    .logo-sparkle-zone {
      left: 34%;
      top: 1.5%;
      width: 31%;
      height: 18%;
    }

    /* Spoke sparkle area */
    .spoke-sparkle-zone {
      left: 3%;
      top: 29%;
      width: 91%;
      height: 24%;
    }

    /* Sparkle star */
    .sparkle {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: 0;
      animation: twinkle 2.8s infinite ease-in-out;
      filter: drop-shadow(0 0 6px rgba(210, 255, 0, 0.9));
    }

    .sparkle.small {
      width: 12px;
      height: 12px;
    }

    .sparkle.large {
      width: 26px;
      height: 26px;
    }

    .sparkle::before,
    .sparkle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(235, 255, 140, 0.95);
      border-radius: 3px;
      box-shadow:
        0 0 8px rgba(235, 255, 140, 0.95),
        0 0 18px rgba(220, 255, 100, 0.75),
        0 0 30px rgba(255, 255, 255, 0.45);
    }

    .sparkle::before {
      width: 2px;
      height: 100%;
    }

    .sparkle::after {
      width: 100%;
      height: 2px;
    }

    /* Shine sweep */
    .shine-sweep {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .shine-sweep::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -30%;
      width: 22%;
      height: 140%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-22deg);
      filter: blur(5px);
      opacity: 0.8;
      animation: sweep 4.8s infinite linear;
    }

    .spoke-sparkle-zone .shine-sweep::before {
      width: 14%;
      animation-duration: 3.8s;
    }

    @keyframes twinkle {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }
      20% {
        opacity: 1;
        transform: scale(1);
      }
      45% {
        opacity: 0.35;
        transform: scale(0.7);
      }
      70% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 0;
        transform: scale(0.4);
      }
    }

    @keyframes sweep {
      0% {
        left: -30%;
      }
      100% {
        left: 120%;
      }
    }

    /* ---------- Clickable button areas ---------- */
    .spoke-measurement-link {
      position: absolute;
      left: 13.5%;
      top: 81.2%;
      width: 74%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 22px;
      text-decoration: none;
      z-index: 3;
    }

    .spoke-specification-link {
      position: absolute;
      left: 13.5%;
      top: 90.2%;
      width: 74%;
      height: 7.5%;
      display: block;
      cursor: pointer;
      border-radius: 22px;
      text-decoration: none;
      z-index: 3;
    }

    .spoke-measurement-link:hover,
    .spoke-specification-link:hover {
      background: rgba(164, 255, 0, 0.12);
      box-shadow: 0 0 30px rgba(164, 255, 0, 0.85);
    }

    @media (max-width: 768px) {
      .image-wrapper {
        max-width: 100%;
      }

      .logo-sparkle-zone {
        left: 34%;
        top: 1.5%;
        width: 31%;
        height: 18%;
      }

      .spoke-sparkle-zone {
        left: 3%;
        top: 29%;
        width: 91%;
        height: 24%;
      }

      .spoke-measurement-link {
        left: 13.5%;
        top: 81.2%;
        width: 74%;
        height: 7.5%;
      }

      .spoke-specification-link {
        left: 13.5%;
        top: 90.2%;
        width: 74%;
        height: 7.5%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="image-wrapper">

      <!-- Main image -->
      <img
        src="poster.png"
        alt="Newson Sportec Precision Spokes"
        class="main-image"
      />

      <!-- Logo sparkle effect -->
      <div class="sparkle-zone logo-sparkle-zone">
        <div class="shine-sweep"></div>

        <span class="sparkle large" style="left: 18%; top: 18%; animation-delay: 0s;"></span>
        <span class="sparkle small" style="left: 42%; top: 30%; animation-delay: 0.5s;"></span>
        <span class="sparkle" style="left: 70%; top: 20%; animation-delay: 1s;"></span>
        <span class="sparkle small" style="left: 28%; top: 62%; animation-delay: 1.4s;"></span>
        <span class="sparkle large" style="left: 56%; top: 58%; animation-delay: 1.9s;"></span>
        <span class="sparkle small" style="left: 80%; top: 68%; animation-delay: 2.3s;"></span>
      </div>

      <!-- Spoke sparkle effect -->
      <div class="sparkle-zone spoke-sparkle-zone">
        <div class="shine-sweep"></div>

        <span class="sparkle small" style="left: 8%; top: 70%; animation-delay: 0.1s;"></span>
        <span class="sparkle" style="left: 18%; top: 55%; animation-delay: 0.7s;"></span>
        <span class="sparkle small" style="left: 31%; top: 43%; animation-delay: 1.2s;"></span>
        <span class="sparkle large" style="left: 46%; top: 48%; animation-delay: 1.8s;"></span>
        <span class="sparkle small" style="left: 60%; top: 42%; animation-delay: 2.1s;"></span>
        <span class="sparkle" style="left: 74%; top: 38%; animation-delay: 2.5s;"></span>
        <span class="sparkle small" style="left: 87%; top: 34%; animation-delay: 2.9s;"></span>
      </div>

      <!-- Clickable Spoke Measurement button -->
      <a
        class="spoke-measurement-link"
        href="https://newsonsportec.github.io/spoke-measurement-guide/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spoke Measurement Guide"
        title="Spoke Measurement"
      ></a>

      <!-- Clickable Spoke Specification button -->
      <a
        class="spoke-specification-link"
        href="https://newsonsportec.github.io/Spoke-Specifications/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spoke Specifications"
        title="Spoke Specification"
      ></a>

    </div>
  </main>
</body>
</html>
